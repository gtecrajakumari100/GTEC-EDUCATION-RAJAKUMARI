<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="blueGoldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="60%" stop-color="#003B73"/>
      <stop offset="100%" stop-color="#0052D4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F4C542"/>
    </linearGradient>
  </defs>

  <rect width="400" height="250" fill="url(#blueGoldBg)"/>
  
  <!-- Subtle Gold Geometry -->
  <circle cx="360" cy="40" r="120" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.25"/>
  <circle cx="40" cy="210" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.2"/>

  <g transform="translate(145, 60)">
    <!-- Graduation Cap Emblem -->
    <path d="M 55 10 L 105 35 L 55 60 L 5 35 Z" fill="url(#goldGrad)"/>
    <path d="M 25 50 L 25 80 C 25 95 85 95 85 80 L 85 50" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 95 38 L 95 85" fill="none" stroke="#F4C542" stroke-width="3"/>
    <circle cx="95" cy="88" r="4" fill="#F4C542"/>
  </g>

  <text x="200" y="180" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    G-TEC EDUCATION
  </text>
  <text x="200" y="205" font-family="'Outfit', 'Inter', sans-serif" font-weight="600" font-size="13" fill="#D4AF37" text-anchor="middle" letter-spacing="2">
    RAJAKUMARI ACADEMY
  </text>
</svg>
